<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OyeSaavedra</title><meta name="description" content="OyeSaavedra, sello discográfico puertorriqueño creado en 2018. Javiielo, Nekxum, Narva, DimeKlvin, Bermudas y JBD JBD."><meta property="og:title" content="OyeSaavedra"><meta property="og:image" content="/logo.webp"><link rel="icon" href="/logo.webp"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet"><style>:root{--bg:#0B0915;--s:#171225;--g:#AAA5B8;--grad:linear-gradient(100deg,#FF343F,#F00078 40%,#D600A9 65%,#8A00FF)}*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth}body{background:var(--bg);color:#fff;font-family:Archivo,system-ui,sans-serif;line-height:1.5}a{color:inherit;text-decoration:none}a:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid #F00078;outline-offset:3px}header{position:sticky;top:0;z-index:9;display:flex;align-items:center;justify-content:space-between;padding:12px 5vw;background:rgba(11,9,21,.9);backdrop-filter:blur(10px);border-bottom:1px solid #ffffff14}header img{width:44px;height:44px;border-radius:50%}nav{display:flex;gap:22px;font-size:14px;font-weight:500}nav a{color:var(--g);padding:6px 0;border-bottom:2px solid transparent}nav a:hover,nav a.on{color:#fff;border-color:#F00078}#mb{display:none;background:0;border:1px solid #ffffff30;color:#fff;border-radius:8px;padding:8px 14px;font:inherit}main{min-height:70vh}.hero{padding:12vh 5vw 10vh;max-width:1200px;margin:auto}h1{font-size:clamp(46px,11vw,150px);font-weight:900;font-stretch:75%;line-height:.92;letter-spacing:-.02em;animation:u .9s cubic-bezier(.2,.7,.2,1) both}.hero p{max-width:46ch;color:var(--g);margin:28px 0;font-size:18px}.btn{display:inline-block;padding:14px 26px;bord all{display:none}}</style></head><body><header><a href="/" aria-label="OyeSaavedra, inicio"><img src="/logo.webp" alt="OyeSaavedra" width="44" height="44"></a><button id="mb" aria-expanded="false" aria-controls="nv">Menú</button><nav id="nv"><a href="/">Inicio</a><a href="/artistas">Artistas</a><a href="/musica">Música</a><a href="/productores">Productores</a><a href="/nosotros">Nosotros</a><a href="/noticias">Noticias</a><a href="/contacto">Contacto</a></nav></header><main id="app"></main><footer><img src="/logo.webp" alt="" width="36" height="36"><span>© <span id="y"></span> OyeSaavedra</span><span>Sello discográfico · Puerto Rico</span><a href="https://instagram.com/oyesaavedra" rel="noopener" target="_blank">Instagram</a></footer><script>const A=[['javiielo', 'Javiielo', 'javiielo', 'Artista', '<div style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -100; pointer-events: none; background-image: url(https://raw.githubusercontent.com/JMain2727/OyeSaavedra1/main/Javiielo0.jpg); background-size: cover; background-position: center; opacity: 0.15; -webkit-mask-image: linear-gradient(to bottom, black 30%, transparent 100%); mask-image: linear-gradient(to bottom, black 30%, transparent 100%);"></div><div style="display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 40px; width: 100%;"><p style="flex: 1 1 300px; font-size: 16px; line-height: 1.6; text-align: left; margin: 0; color: white;">Carlos Javier Marrero Fournier, mejor conocido artísticamente como Javiielo, es un cantante y compositor puertorriqueño. A lo largo de los últimos años, se ha consolidado como una de las voces más sólidas e innovadoras de la nueva generación del género urbano. <br>Javiielo ha destacado por su versatilidad creando un estilo melódico y auténtico. <br>Gracias a éxitos de alcance internacional como &quot;Pa los gustos, los colores&quot; y &quot;Cenicero&quot;, ha acumulado millones de reproducciones en plataformas digitales.</p><img src="https://raw.githubusercontent.com/JMarin2727/OyeSaavedra1/refs/heads/main/Javiielo1.jpg" style="width: 280px; height: 350px; flex-shrink: 0; object-fit: cover; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.5);"></div>'],['nekxum','Nekxum','nekxum','Artista y productor','Colaborador frecuente de Javiielo. Acreditado como productor y como ingeniero de mezcla y masterización en Sexting. Apple Music registra su lanzamiento Invierno En Verano (2026).','Nekxum'],['narva','Narva','narvapr','Artista','Apple Music tiene un perfil NARVA con lanzamientos entre 2021 y junio de 2026 (Más de ti, MI LADY, SEXXXO, NO SOY CUALQUIERA, DIEZ/DIEZ, Tóxicx2, no te enchule). Pendiente confirmar que ese perfil corresponde al Narva del sello.','Narva'],['dimeklvin','DimeKlvin','dimeklvin','Artista','Perfil musical, lanzamientos y créditos en verificación. No atribuimos canciones sin una coincidencia confirmada.','DimeKlvin'],['bermudas','Bermudas','itsbermudas','Productor','Productor acreditado en Santuario (2022) y en Sexting (2023). Su perfil oficial está por confirmar: existe otro Bermudas en Spotify sin vínculo comprobado.','Bermudas'],['jbd-jbd','JBD JBD','jbdjbdpr','Productor y artista','Productor y artista de Puerto Rico. Aparece entre los productores de Santuario (2022) y en Pa Los Gustos Los Colores (2019). En Apple Music figuran Un Nuevo Amanecer (EP, 2024) y Personal Stripper (2025).','JBD']];const R=[['Pensamientos II','Javiielo, Nekxum','2026-07-15','Sencillo','℗ 2026 Oye Saavedra · Fuente: Spotify'],['El Snto','Javiielo, Nekxum','2025-10-30','Álbum · 11 canciones','℗ 2025 Oye Saavedra · Fuente: Apple Music'],['Quiso Escaparse','Javiielo, Nekxum','2024-05-24','Sencillo','℗ Oye Saavedra / EMPIRE · Fuente: Apple Music'],['Sexting','Javiielo, Anubiis, Nekxum','2023','Sencillo','Producción: Nekxum, Bermudas, Wilfredo Rodríguez Santos · Mezcla y masterización: Nekxum · Fuente: Apple Music'],['Trust No One','Javiielo, Nekxum','2023','Proyecto','Asociado a Oye Saavedra / EMPIRE'],['Santuario','Javiielo','2022-11-16','Álbum · 21 canciones','Productores citados: JBD, Nekxum, Bermudas, OMB, Xound · Fuente: Perú21'],['Pa Los Gustos Los Colores','Javiielo, Nekxum, JBD JBD','2019-08-16','Sencillo','℗ 2019 Oye Saavedra / EMPIRE · Fuente: Spotify']];const Y='https://www.youtube.com/watch?v=';const V=[['Bartender','Javiielo, Nekxum','Audio oficial',Y+'Oa0EvIdHkBE'],['Mi Casi Algo','Javiielo','Video oficial · Prod. Nekxum',Y+'yLn5KVVCTFE'],['Repítelo','Javiielo','Video oficial · Prod. Nekxum, JBD',Y+'pECOV27Jmzs'],['Ese Man','Javiielo, Lary Over','Video oficial · Prod. Nekxum, JBD',Y+'zFOQOXlYeZs'],['Pa Los Gustos Los Colores Remix','Javiielo, Brytiago, KHEA, Omy De Oro','Video oficial · Prod. Nekxum, JBD',Y+'0czOYSFxEe4']];const ig=u=>`<a class="btn o" style="margin:0" target="_blank" rel="noopener" href="https://instagram.com/${u}">Instagram @${u}</a>`;const P='<p class="note">Información pendiente de verificación con fuentes oficiales. No publicamos datos sin confirmar.</p>';const roster='<div class="roster">'+A.map(a=>`<a href="/artistas/${a[0]}">${a[1]}<small>${a[3]}</small></a>`).join('')+'</div>';const T=(h,b)=>`<section class="sec"><h2>${h}</h2>${b}</section>`;const rel=l=>l.length?l.map(r=>`<div class="rel"><div><b>${r[0]}</b><br><span>${r[1]} · ${r[3]} · ${r[2]}</span><br><span>${r[4]}</span></div></div>`).join(''):'<p class="note">No hay lanzamientos documentados con esos filtros.</p>';const vid=l=>l.map(r=>`<div class="rel"><div><b>${r[0]}</b><br><span>${r[1]} · ${r[2]}</span></div><a target="_blank" rel="noopener" href="${r[3]}">Ver en YouTube</a></div>`).join('');const yrs=[...new Set(R.map(r=>r[2].slice(0,4)))];const q=(k,y)=>R.filter(r=>(!k||(r[1]+r[4]).includes(k))&&(!y||r[2].startsWith(y)));const FN='<p class="note" style="margin-top:16px">Fechas y créditos tomados de fichas de Spotify, Apple Music y prensa. El catálogo no es completo y los enlaces de escucha se añadirán cuando estén verificados.</p>';const pages={'/':()=>`<section class="hero"><h1>OYE<br>SAAVEDRA</h1><p>OyeSaavedra es un sello discográfico puertorriqueño creado en 2018. <br>Conoce a sus artistas y productores.</p><a class="btn" href="/artistas">Ver artistas</a><a class="btn o" href="/musica">Lanzamientos</a></section>`+T('Roster',roster),'/artistas':()=>T('Artistas',roster),'/musica':()=>T('Música',`<div class="fl"><select id="fa" data-f aria-label="Artista"><option value="">Todos los artistas</option>${A.map(a=>`<option value="${a[5]}">${a[1]}</option>`).join('')}</select><select id="fy" data-f aria-label="Año"><option value="">Todos los años</option>${yrs.map(y=>`<option>${y}</option>`).join('')}</select></div><div id="lst">${rel(q())}</div><h3>Videos oficiales</h3>${vid(V)}${FN}`),'/productores':()=>T('Productores',`<h3>Nekxum</h3><p class="note">Productor, ingeniero de mezcla y masterización acreditado en Sexting; también artista del roster.</p><h3>Bermudas</h3><p class="note">Productor acreditado en Santuario y Sexting. Perfil oficial por confirmar.</p><h3>JBD JBD</h3><p class="note">Productor entre los citados de Santuario; perfil propio en Apple Music con Un Nuevo Amanecer (2024) y Personal Stripper (2025).</p><p class="t">Otros productores citados en Santuario: OMB y Xound. Participar en un tema no implica contrato con el sello.</p>`),'/nosotros':()=>T('Nosotros',`<p class="t">Según Wapa (10 de septiembre de 2022), OyeSaavedra se creó en 2018 como emprendimiento de Yolanda J. Saavedra González. Sus primeros proyectos incluyeron a Javiielo y Nayhlo.</p><p class="t">Su actividad documentada es el desarrollo y lanzamiento de música urbana, con créditos compartidos con EMPIRE en lanzamientos históricos y copyright propio en 2025 y 2026.</p><h3>Yolanda J. Saavedra González</h3><p class="t">Fundadora del sello según la prensa. Perú21 la menciona como representante de la compañía en la presentación del álbum Santuario. Su biografía completa y su fotografía oficial están pendientes de fuente primaria.</p>${ig('oyesaavedra')}`),'/noticias':()=>T('Noticias',`<div class="rel"><div><b>OYESAAVEDRA, sello de emprendedora puertorriqueña con éxito internacional</b><br><span>Wapa · 10 de septiembre de 2022</span><br><span>Perfil de la compañía: fundadora, inicio en 2018 y primeros proyectos.</span></div></div><div class="rel"><div><b>Santuario: OyeSaavedra presenta el nuevo álbum de Javiielo</b><br><span>Perú21 · 5 de diciembre de 2022</span><br><span>Lanzamiento, productores y colaboradores del álbum.</span></div></div><p class="note" style="margin-top:16px">No hay aún una sala de prensa oficial ni noticias confirmadas de 2026.</p>`),'/contacto':()=>T('Contacto',`<p class="note">El correo y el teléfono profesionales no están verificados, así que no se publican. Por ahora, escríbenos por Instagram.</p>${ig('oyesaavedra')}`)};function r(){const p=location.pathname.replace(/\/$/,'')||'/',m=p.match(/^\/artistas\/(.+)$/),x=m&&A.find(a=>a[0]===m[1]);let h;if(x){const l=q(x[5]),v=V.filter(e=>(e[0]+e[1]+e[2]).includes(x[5]));h=T(x[1],`<p class="t">${x[3]}</p><p class="t">${x[4]}</p>`+(l.length?'<h3>Créditos documentados</h3>'+rel(l):P)+(v.length?'<h3>Videos oficiales</h3>'+vid(v):'')+'<p style="margin-top:24px">'+ig(x[2])+' <a class="btn o" href="/artistas">Volver</a></p>')}else h=(pages[p]||(()=>T('Página no encontrada','<a class="btn" href="/">Ir al inicio</a>')))();document.getElementById('app').innerHTML=h;document.title=(x?x[1]+' · ':'')+'OyeSaavedra';document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.pathname===(x?'/artistas':p)));nv.classList.remove('open');scrollTo(0,0)}document.addEventListener('click',e=>{const a=e.target.closest('a');if(a&&a.origin===location.origin&&!a.hash&&!a.target){e.preventDefault();history.pushState(0,'',a.pathname);r()}});document.addEventListener('change',e=>{if(e.target.hasAttribute('data-f'))lst.innerHTML=rel(q(fa.value,fy.value))});mb.onclick=()=>{mb.setAttribute('aria-expanded',nv.classList.toggle('open'))};addEventListener('popstate',r);y.textContent=new Date().getFullYear();r()</script></body></html>
